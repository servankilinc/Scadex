<svg xmlns="http://www.w3.org/2000/svg" width="200" height="150" viewBox="0 0 200 150">
  <!-- Scadex sistem şablonu. data-pin merkezleri AppDbContext seed'indeki pin konumlarıyla birebir aynıdır: birini değiştiren ikisini birden değiştirir. -->
  <style>text{font-family:Bahnschrift,'DIN Alternate','Arial Narrow',Arial,sans-serif;font-weight:700;text-anchor:middle;fill:#111}.w{fill:#fff}</style>
  <rect x="20" y="10" width="160" height="70" rx="8" fill="#1F2937" stroke="#111" stroke-width="2.5"/>
  <circle cx="40" cy="45" r="7" fill="none" stroke="#60A5FA" stroke-width="2"/>
  <path d="M40 37 V45" stroke="#60A5FA" stroke-width="2" stroke-linecap="round"/>
  <text x="100" y="50" font-size="13" class="w">BİLGİSAYAR</text>
  <g fill="#9CA3AF">
    <rect x="142" y="40" width="12" height="6" rx="1"/>
    <rect x="160" y="40" width="12" height="6" rx="1"/>
  </g>
  <rect x="60" y="62" width="80" height="4" rx="2" fill="#374151"/>

  <rect x="24" y="94" width="152" height="50" rx="5" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <line x1="120" y1="98" x2="120" y2="140" stroke="#111" stroke-width="1"/>
  <g font-size="11">
    <text x="50" y="114">+12V</text>
    <text x="90" y="114">GND</text>
    <text x="150" y="114">RJ45</text>
  </g>
  <g fill="#111">
    <circle data-pin="+12V" cx="50" cy="128" r="7"/>
    <circle data-pin="GND" cx="90" cy="128" r="7"/>
    <circle data-pin="RJ45" cx="150" cy="128" r="7"/>
  </g>
</svg>
